name: Bug report
description: Report a reproducible problem in GPT-DeepSeek V1 Orchestrator
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Remove credentials, private paths, provider payloads, state files, and sensitive logs before submitting.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed secrets and private repository data.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.1.0 or a commit hash
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Execution mode
      options:
        - FakeAdapter / offline
        - Live provider and DeepSeek Harness
        - Both
        - Not sure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Git version, and relevant tool versions.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Include minimal output, traceback, or Git evidence. Do not include credentials, private paths, task state, or sensitive logs.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that may help diagnose the problem.
