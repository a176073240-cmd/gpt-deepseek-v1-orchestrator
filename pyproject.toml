[project]
name = "gpt-deepseek-v1-orchestrator"
version = "1.2.1"
description = "Durable GPT planner/reviewer and DeepSeek Harness executor"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.5,<7"]
packaging = ["PyInstaller>=6.10,<7"]

[project.scripts]
orchestrator = "v1_orchestrator.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"


